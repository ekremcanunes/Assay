name: assay

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  kratos-migrate:
    image: oryd/kratos:v1.2.0
    logging: *default-logging
    command: migrate sql -e --yes
    environment:
      DSN: ${KRATOS_DSN}
    volumes:
      - ./kratos:/etc/config/kratos
    restart: on-failure

  kratos:
    image: oryd/kratos:v1.2.0
    logging: *default-logging
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    expose:
      - "4433"
      - "4434"
    environment:
      DSN: ${KRATOS_DSN}
      LOG_LEVEL: info
      SECRETS_COOKIE_0: ${KRATOS_SECRETS_COOKIE}
      SECRETS_CIPHER_0: ${KRATOS_SECRETS_CIPHER}
      # kratos.yml'deki localhost URL'lerini ortama gore ezer (prod: deploy.sh APP_URL verir).
      SERVE_PUBLIC_BASE_URL: ${APP_URL:-http://localhost}/.ory/
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS_0: ${APP_URL:-http://localhost}
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${APP_URL:-http://localhost}/
      SELFSERVICE_ALLOWED_RETURN_URLS_0: ${APP_URL:-http://localhost}
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${APP_URL:-http://localhost}/error
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${APP_URL:-http://localhost}/settings
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${APP_URL:-http://localhost}/login
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${APP_URL:-http://localhost}/login
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${APP_URL:-http://localhost}/register
      SELFSERVICE_FLOWS_VERIFICATION_UI_URL: ${APP_URL:-http://localhost}/verification
      # Açma/kapama (spec §10.1): .env'de değiştir → docker compose up -d
      SESSION_WHOAMI_REQUIRED_AAL: ${AUTH_REQUIRED_AAL:-highest_available}
      SELFSERVICE_FLOWS_VERIFICATION_ENABLED: ${AUTH_VERIFICATION_ENABLED:-true}
      COURIER_SMTP_CONNECTION_URI: ${COURIER_SMTP_CONNECTION_URI:-smtp://mailpit:1025/?disable_starttls=true}
      COURIER_SMTP_FROM_ADDRESS: ${COURIER_SMTP_FROM_ADDRESS:-no-reply@assay.com.tr}
      COURIER_CHANNELS_0_REQUEST_CONFIG_AUTH_CONFIG_VALUE: ${SMS_RELAY_API_KEY}
    volumes:
      - ./kratos:/etc/config/kratos
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:alpine
    logging: *default-logging
    expose:
      - "6379"

  market-service:
    image: ${ECR_REGISTRY:-local}/assay/market-service:${IMAGE_TAG:-dev}
    logging: *default-logging
    expose:
      - "5002"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5002
      - ASPNETCORE_ENVIRONMENT=Production
      # Gerçek prod (AWS) ortamında Warning olarak set edilir; burada lokal teşhis için Information.
      - Serilog__MinimumLevel__Default=${LOG_LEVEL:-Information}
      - Serilog__MinimumLevel__Override__Microsoft=${LOG_LEVEL_FRAMEWORK:-Warning}
      - Serilog__MinimumLevel__Override__System=${LOG_LEVEL_FRAMEWORK:-Warning}
      - TwelveData__ApiKey=${TWELVEDATA_API_KEY}
      - REDIS_CONNECTION=redis:6379
      - Kratos__BaseUrl=http://kratos:4433
    depends_on:
      - redis
      - kratos

  portfolio-service:
    image: ${ECR_REGISTRY:-local}/assay/portfolio-service:${IMAGE_TAG:-dev}
    logging: *default-logging
    expose:
      - "5001"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - ASPNETCORE_ENVIRONMENT=Production
      - Serilog__MinimumLevel__Default=${LOG_LEVEL:-Information}
      - Serilog__MinimumLevel__Override__Microsoft=${LOG_LEVEL_FRAMEWORK:-Warning}
      - Serilog__MinimumLevel__Override__System=${LOG_LEVEL_FRAMEWORK:-Warning}
      - Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore=${LOG_LEVEL_EFCORE:-Warning}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ServiceUrls__MarketService=http://market-service:5002
      - Kratos__BaseUrl=http://kratos:4433
      - Sms__Enabled=${SMS_ENABLED:-false}
      - Sms__DailyLimit=${SMS_DAILY_LIMIT:-16}
      - Sms__RelayApiKey=${SMS_RELAY_API_KEY}
      - Sms__Url=${SMS_URL}
      - Sms__Sender=${SMS_SENDER}
      - Sms__AuthHeader=${SMS_AUTH_HEADER}
      - Sms__AuthValue=${SMS_AUTH_VALUE}
      - Sms__BodyTemplate=${SMS_BODY_TEMPLATE}
      # Kratos'a giden AUTH_REQUIRED_AAL ile ayni deger: /api/auth/options frontend'e 2. adim seceneklerini soyler.
      - Auth__RequiredAal=${AUTH_REQUIRED_AAL:-highest_available}
      - Auth__EmailOtpEnabled=${EMAIL_OTP_ENABLED:-true}
    depends_on:
      - market-service
      - kratos

  web:
    image: ${ECR_REGISTRY:-local}/assay/web:${IMAGE_TAG:-dev}
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro   # deploy.sh Secrets Manager'dan yazar (Cloudflare Origin sertifikasi)
    depends_on:
      - portfolio-service
      - kratos

