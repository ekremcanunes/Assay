name: assay

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  kratos-migrate:
    image: oryd/kratos:v1.2.0
    logging: *default-logging
    command: migrate sql -e --yes
    environment:
      DSN: ${KRATOS_DSN}
    volumes:
      - ./kratos:/etc/config/kratos
    restart: on-failure

  kratos:
    image: oryd/kratos:v1.2.0
    logging: *default-logging
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    expose:
      - "4433"
      - "4434"
    environment:
      DSN: ${KRATOS_DSN}
      LOG_LEVEL: info
    volumes:
      - ./kratos:/etc/config/kratos
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:alpine
    logging: *default-logging
    expose:
      - "6379"

  market-service:
    build: ./market-service
    logging: *default-logging
    expose:
      - "5002"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5002
      - ASPNETCORE_ENVIRONMENT=Production
      # Gerçek prod (AWS) ortamında Warning olarak set edilir; burada lokal teşhis için Information.
      - Serilog__MinimumLevel__Default=${LOG_LEVEL:-Information}
      - Serilog__MinimumLevel__Override__Microsoft=${LOG_LEVEL_FRAMEWORK:-Warning}
      - Serilog__MinimumLevel__Override__System=${LOG_LEVEL_FRAMEWORK:-Warning}
      - TwelveData__ApiKey=${TWELVEDATA_API_KEY}
      - REDIS_CONNECTION=redis:6379
      - Kratos__BaseUrl=http://kratos:4433
    depends_on:
      - redis
      - kratos

  portfolio-service:
    build: ./portfolio-service
    logging: *default-logging
    expose:
      - "5001"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - ASPNETCORE_ENVIRONMENT=Production
      - Serilog__MinimumLevel__Default=${LOG_LEVEL:-Information}
      - Serilog__MinimumLevel__Override__Microsoft=${LOG_LEVEL_FRAMEWORK:-Warning}
      - Serilog__MinimumLevel__Override__System=${LOG_LEVEL_FRAMEWORK:-Warning}
      - Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore=${LOG_LEVEL_EFCORE:-Warning}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ServiceUrls__MarketService=http://market-service:5002
      - Kratos__BaseUrl=http://kratos:4433
    depends_on:
      - market-service
      - kratos

  web:
    build: ./web
    logging: *default-logging
    ports:
      - "80:80"
    depends_on:
      - portfolio-service
      - kratos

