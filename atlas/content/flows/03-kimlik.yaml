nodes:
  - { id: login, lane: client, col: 0, title: "Giriş sayfası", sub: "/login · React", icon: browser }
  - { id: kratos, lane: app, col: 1, title: "Kratos", sub: ":4433 /self-service", icon: user }
  - { id: portfolio, lane: app, col: 2, title: "portfolio-service", sub: "KratosMiddleware", icon: server }
  - { id: kdb, lane: data, col: 1, title: "Postgres (Kratos)", sub: "kimlik · oturum", icon: db }
