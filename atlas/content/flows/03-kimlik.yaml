id: kimlik
no: "03"
group: altyapi
eyebrow: "Akış 03 · Kimlik · Ory Kratos"
title: "Giriş *iki adımda* nasıl olur?"
lede: >-
  Şifre, e-posta kodu ve oturum. Kimlik işini Assay'ın kendi kodu değil, Ory Kratos yapar.
  Frontend formu çizer, backend oturumu Kratos'a sorar.
stats:
