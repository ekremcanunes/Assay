id: kaynaklar
no: "06"
group: veri
eyebrow: "Akış 06 · Veri kaynakları · Dış API'ler"
title: "Veri *nereden* geliyor?"
lede: >-
  Assay kendi piyasa verisini üretmez. Üç ücretsiz kaynaktan alır ve her birini tek bir iş için kullanır:
  Yahoo fiyat, Frankfurter döviz, Twelve Data enstrüman listesi. Fiyatı bir kullanıcı isteği, listeyi her sabah çalışan bir iş çeker.
