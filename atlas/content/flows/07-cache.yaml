      # içeren cevaplarda en erken biten kayıt esas alınır. Frontend staleTime'ı bu header'dan okur.
      public class CacheLifetimeMiddleware(RequestDelegate next)
      {
          public const string HeaderName = "X-Cache-Expires-In";

  - id: tarayici
    node: rq
    edge: [pmw, rq]
    title: "React Query en erken biten kaydın süresini kullanır"
    what: >-
      `serverCached()` başlıktaki saniyeyi okur ve kesin bir bitiş anına çevirir: `Date.now() + saniye × 1000`.
      `Date.now()` şu anı milisaniye olarak verir; `× 1000` saniyeyi milisaniyeye çevirir.
      Örnek: başlık `240`, şu an `1 000 000` ms → bitiş anı `1 240 000` ms.
      React Query tazeliği her sorduğunda `staleTime` kalan süreyi hesaplar: `bitiş anı − şimdi`.
      100 sn sonra kalan 140 sn'dir, veri tazedir. 240 sn sonra kalan 0'dır, veri bayattır. Başlık yoksa kalan hep 0'dır.
    why: >-
      Frontend kendi süresini belirlemez; Redis'in kalan süresini kopyalar. Süreler yalnız backend'de (`CacheTtl`) tanımlıdır.
      Redis kaydı dolmadan istek atmak boşunadır: sunucu aynı veriyi döner.
      Saniye yerine bitiş anı saklanır, çünkü "240 sn" zamanla eskir; "1 240 000'de biter" hep doğrudur.
    cost: >-
      Bayat veri silinmez. React Query onu bellekte tutar ve ekran açılınca önce onu gösterir, yenisini arkada ister.
      Ekranda kullanılmayan veri 5 dakika sonra bellekten silinir (React Query varsayılanı, `gcTime`).
    next:
      - { when: "Veri bayat oldu → ne zaman yenilenir?", to: tetik }
    terms: [stale-time]
    file: web/src/hooks/queries.js
    code: |
      queryFn: () =>
        request().then((r) => {
          const seconds = Number(r.headers[EXPIRES_HEADER])
          return { data: r.data, expiresAt: Number.isFinite(seconds) ? Date.now() + seconds * 1000 : null }
        }),
      staleTime: (query) => {
        const expiresAt = query.state.data?.expiresAt
        return expiresAt ? Math.max(0, expiresAt - Date.now()) : 0
      },

  - id: tetik
    node: rq
    edge: null
    title: "Yeni veri ne zaman gelir?"
    what: >-
      Ekran açık beklerse veri hiç yenilenmez; süre dolsa da dolmasa da. Yeni istek için bir tetik gerekir.
      Ekran yeniden açılır (sayfa değişip geri gelinir): istek yalnız veri bayatsa atılır.
      İnternet bağlantısı geri gelir: istek yalnız veri bayatsa atılır.
      F5: tarayıcı belleği silinir, istek her zaman atılır.
      Alım veya satış kaydedilir: `invalidateQueries` veriyi bayat sayar, istek her zaman atılır.
      Pencereye geri dönmek tetik değildir (`refetchOnWindowFocus: false`).
    why: >-
      F5 veya alım/satış, süre dolmadan da istek atar. Ama fiyat değişmez: market-service Redis'teki aynı kaydı döner.
      Yeni fiyat için iki şart birlikte gerekir: Redis süresi dolmuş olmalı ve bir tetik olmalı.
      Örnek: fiyat 10:00'da Redis'e yazıldı (5 dk). 10:02'de F5 → aynı fiyat. 10:06'da F5 → Yahoo'dan yeni fiyat.
    cost: >-
      Ekranı açık bırakan kullanıcı eski fiyatı görür. Yenilemek için sayfa değiştirmeli veya F5'e basmalıdır.
      İstisna durum şerididir (`useSystemStatus`): dakikada bir kendiliğinden yenilenir (`refetchInterval`).
    next:
      - { when: "Tetik geldi, veri bayat → yeni istek", to: istek }
      - { when: "Tetik geldi, veri taze (ekran değişimi) → istek yok", to: ekran }
    terms: [stale-time, ttl]
    file: web/src/App.jsx
    code: |
      const queryClient = new QueryClient({
        defaultOptions: {
          queries: {
            staleTime: 60_000,        // 1 dk taze — geri gelince anında, arkada sessiz yenileme
            refetchOnWindowFocus: false,
            retry: 1,
          },
        },
      })

  - id: ozet
    node: life
    edge: null
    aux: [store, mmw, pclient, plife, pmw]
    title: "Benzer adlı parçalar: kim ne yapar?"
    what: >-
      `CacheStore` veriyi yönetir. Redis'e bakar; kayıt yoksa kaynaktan çeker ve bitiş anıyla yazar. Her fiyat için bir kez çalışır.
      `CacheLifetime` yalnız süreyi tutar. Veriyi görmez; istek boyunca bildirilen bitiş anlarından en erkenini saklar.
      Middleware süreyi cevaba koyar. Cevap çıkarken `CacheLifetime.SecondsLeft()` değerini `X-Cache-Expires-In` başlığına yazar. İstek başına bir kez çalışır.
      portfolio-service'te `CacheStore` yoktur; Redis'e gitmez. Süreyi `MarketServiceClient` başlıktan okur ve kendi `CacheLifetime`'ına bildirir.
    why: >-
      Her parça tek iş yapar: veri (`CacheStore`), süre (`CacheLifetime`), başlık (middleware).
      Örnek: portföyde THYAO (4 dk kaldı) ve ASELS (1 dk kaldı) var. `CacheStore` iki kez `Report` çağırır. `CacheLifetime` 1 dk'yı tutar. Middleware başlığa `60` yazar.
      `CacheLifetime` ve middleware iki serviste ayrı sınıflardır, çünkü servisler ayrı programlardır ve birbirinin sınıfını kullanamaz.
      `CacheLifetime` her HTTP isteği için yeni oluşur (scoped). Böylece bir kullanıcının süresi başka kullanıcının cevabına karışmaz.
    cost: >-
      Aynı adlı sınıflar iki serviste farklı klasördedir: market-service'te `Caching/`, portfolio-service'te `Services/`.
      Başlık adı da iki middleware'de ayrı tanımlıdır; ad değişirse iki dosya da değişmelidir.
    terms: [cache-aside, middleware, scoped]
