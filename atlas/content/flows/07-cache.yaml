steps:
  - id: ekran
    node: rq
    edge: null
    title: "Ekran veriyi ister, önce tarayıcı bakar"
    what: >-
      Varlıklar sayfası (`Assets.jsx`) `usePortfolioSummary()` üzerinden `useHoldings()` hook'unu çağırır.
      React Query `['holdings']` anahtarında veri var mı ve taze mi diye bakar.
      Veri tazeyse istek atılmaz; ekran eldeki veriyi gösterir.
    why: >-
      Aynı veri için iki ekran ayrı istek atmaz. Örnek: Varlıklar sayfasından kategori sayfasına geçilir; veri tazeyse sunucuya gidilmez.
    cost: >-
      Sayfa ilk açıldığında tarayıcıda veri yoktur. Bu durumda istek her zaman atılır.
    next:
      - { when: "Veri taze → istek atılmaz (süre 13. adımda belirlenir)", to: tarayici }
      - { when: "Veri yok veya bayat → istek atılır", to: istek }
    terms: [stale-time]
    file: web/src/hooks/queries.js
    code: |
      export function useHoldings() {
        return useQuery({
          queryKey: queryKeys.holdings,
          ...serverCached(() => assetApi.getAll()),
        })
      }

  - id: istek
    node: asset
    edge: [rq, asset]
    title: "portfolio-service fiyatları toplu ister"
    what: >-
      Tarayıcı `GET /api/assets` atar. nginx `/api/` ile başlayan istekleri portfolio-service'e iletir.
      `AssetController.GetAll()`, `AssetService.GetHoldingsAsync()` metodunu çağırır.
      Varlıklar Postgres'ten okunur ve sembol listesi kurulur: `BIST:THYAO`, `XAU`.
      `GetPriceMapAsync()` bu listeyi tek çağrıyla `MarketServiceClient.GetPricesAsync()`'e verir.
    why: >-
      Fiyat portföy veritabanında tutulmaz. Her istekte market-service'ten alınır.
    cost: >-
      market-service hata verirse `catch` boş sözlük döner. Varlıklar fiyatsız gelir (`PriceAvailable = false`).
    terms: [reverse-proxy]
    file: portfolio-service/Services/AssetService.cs
    code: |
      public async Task<List<AssetHoldingDto>> GetHoldingsAsync(string userId)
      {
          var assets = await db.Assets.Where(a => a.UserId == userId).OrderBy(a => a.Symbol).ToListAsync();
          var priceMap = await GetPriceMapAsync(assets);
          return assets.Select(a => MapToHolding(a, priceMap)).ToList();
      }

      # GetPriceMapAsync içinde:
      var prices = await marketClient.GetPricesAsync(list);

  - id: cagri
