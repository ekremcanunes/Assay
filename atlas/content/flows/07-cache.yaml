      # cevaptaki kalan cache ömrü (X-Cache-Expires-In) bu isteğin CacheLifetime'ına eklenir.
      private async Task<T?> GetAsync<T>(string url)
      {
          var request = new HttpRequestMessage(HttpMethod.Get, url);
          ...
          var response = await httpClient.SendAsync(request);
          response.EnsureSuccessStatusCode();

  - id: anahtar
    node: msvc
    edge: [mctrl, msvc]
    title: "Anahtar kurulur, süre seçilir"
    what: >-
      `MarketService.GetPriceAsync()` önce sembolün türünü bulur: `XAU` altın, `USD`, `EUR`, `GBP` döviz, gerisi hisse.
      `CacheKeys.Price()` anahtarı kurar: `stock:BIST:THYAO`, `gold:XAU`, `currency:USD`.
      Sonra `CacheStore.GetOrSetAsync()` metodunu üç şeyle çağırır: anahtar, kaynaktan çekme fonksiyonu, süre (`CacheTtl.Live`, 5 dk).
    why: >-
      Aynı soruyu soran her kullanıcı aynı kaydı okur. Örnek: iki kullanıcının portföyünde THYAO varsa ikisi de `stock:BIST:THYAO` kaydını okur.
    cost: >-
      Anahtar biçimi değişirse eski kayıtlar okunmaz. Süreleri dolana kadar Redis'te boşuna durur.
    terms: [cache-key]
    file: market-service/Services/MarketService.cs
    code: |
      # Anlık fiyatın tek kaynağı: portföy, piyasa özeti ve "bugün" fiyatı hep buradan, aynı anahtardan okur.
      public async Task<MarketPrice?> GetPriceAsync(string market, string symbol)
      {
          ...
          return await _cache.GetOrSetAsync(CacheKeys.Price(assetType, market, symbol),
              () => assetType switch
              {
                  "Currency" => FetchCurrencyAsync(symbol),
                  "Gold" => FetchGoldAsync(symbol),
                  _ => FetchStockAsync(market, symbol)
              },
              _ => CacheTtl.Live);
      }

  - id: bak
    node: redis
    edge: [store, redis]
    aux: [store]
    auxEdges: [[msvc, store]]
    title: "CacheStore önce Redis'e bakar"
    what: >-
      `GetOrSetAsync()`, `GetStringAsync(key)` ile kaydı Redis'ten okur.
      Kayıt bir zarftır: değer ve bitiş anı birlikte durur (`Entry<T>`). Zarf açılır; değer doluysa kullanılır.
    why: >-
      Kayıt yaşadığı sürece dış kaynağa gidilmez. Örnek: THYAO kaydı 5 dakika yaşar; bu sürede Yahoo'ya THYAO için istek gitmez.
    cost: >-
      Eski biçimde (zarfsız) kalan kayıtta değer boş gelir. Kayıt yok sayılır ve kaynaktan yeniden çekilir.
    next:
      - { when: "Kayıt var, değer dolu → hit", to: hit }
      - { when: "Kayıt yok, süresi dolmuş veya zarfsız → miss", to: miss }
    terms: [cache-aside]
    file: market-service/Caching/CacheStore.cs
    code: |
      var cached = await cache.GetStringAsync(key);
      if (cached != null)
      {
          # Eski biçimdeki (zarfsız) kayıtta Value null gelir → yeniden çekilip üzerine yazılır.
          var entry = JsonSerializer.Deserialize<Entry<T>>(cached);
          if (entry?.Value != null)
          {
              lifetime.Report(entry.ExpiresAt);
              return entry.Value;
          }
      }

  - id: hit
    node: life
    edge: [store, life]
    title: "Hit: değer döner, bitiş anı bildirilir"
    what: >-
      `CacheStore`, zarftaki bitiş anını `CacheLifetime.Report()` ile bildirir ve değeri döndürür.
      `CacheLifetime` bu istekte görülen en erken bitişi tutar.
      Her HTTP isteği için yeni bir `CacheLifetime` nesnesi oluşur (`AddScoped`). Bir isteğin süreleri başka isteğe karışmaz.
    why: >-
      Örnek: cevapta 3 fiyat var. Biri 1 dk, ikisi 4 dk sonra bitiyor. Cevap 1 dk sonra bayatlar; tarayıcıya bu süre bildirilir.
    cost: >-
      Semboller paralel okunur ve aynı nesneye yazar. Bu yüzden `Report()` içinde `lock` gerekir.
    next:
      - { when: "Tüm semboller bitti → cevap hazırlanır", to: baslik }
    terms: [scoped]
    file: market-service/Caching/CacheLifetime.cs
    code: |
      public void Report(DateTimeOffset expiresAt)
      {
          lock (_lock)
          {
              if (_earliest is null || expiresAt < _earliest) _earliest = expiresAt;
          }
      }

  - id: miss
    node: source
    edge: [msvc, source]
    aux: [store]
    title: "Miss: kaynaktan çekilir"
    what: >-
      `CacheStore`, `MarketService`'in verdiği çekme fonksiyonunu çağırır.
      Hisse için `YahooFinanceClient.GetQuoteAsync()`, döviz için `FrankfurterClient.GetExchangeRateAsync()` çalışır.
      Altın için Yahoo'dan `GC=F` (ons) fiyatı alınır ve grama çevrilir.
    why: >-
      TL karşılığı için USD/TRY kuru da gerekir. Kur da `GetPriceAsync("USD")` ile aynı yoldan okunur ve kendi `currency:USD` kaydında durur.
    cost: >-
      Kaynak cevap vermezse fonksiyon `null` döner. `null` Redis'e yazılmaz; bir sonraki istek yeniden dener.
    next:
      - { when: "Değer geldi → Redis'e yazılır", to: yaz }
      - { when: "null → yazılmaz, bitiş bildirilmez, sembol cevaptan düşer", to: baslik }
    terms: [unofficial-api]
    file: market-service/Services/MarketService.cs
    code: |
      private async Task<MarketPrice?> FetchStockAsync(string market, string symbol)
      {
          var quote = await _yahooClient.GetQuoteAsync(YahooSymbol.ToYahoo(market, symbol));
          if (quote == null) return null;

          var usdTryRate = await UsdTryRateAsync();
          if (usdTryRate == null) return null;

  - id: yaz
    node: redis
    edge: [store, redis]
    aux: [life]
    auxEdges: [[store, life]]
    title: "Kayıt bitiş anıyla Redis'e yazılır"
    what: >-
      Bitiş anı = şimdi + süre. Değer ve bitiş anı zarfa konur ve `SetStringAsync()` ile yazılır.
      Aynı an Redis'e `AbsoluteExpiration` olarak da verilir; süre dolunca Redis kaydı kendisi siler.
      Bitiş anı `CacheLifetime.Report()` ile bildirilir.
    why: >-
      .NET'in `IDistributedCache` arayüzü bir kaydın kalan süresini veremez. Zarf bu eksiği kapatır; okuyan taraf kalan süreyi zarftan hesaplar.
    cost: >-
      Kayıt süresi dolana kadar değişmez. Kaynakta fiyat değişse de en fazla 5 dakika eski değer okunur.
    terms: [ttl]
    file: market-service/Caching/CacheStore.cs
    code: |
      var value = await fetch();
      if (value == null) return null;

      var expiresAt = DateTimeOffset.UtcNow + ttl(value);
      await cache.SetStringAsync(key, JsonSerializer.Serialize(new Entry<T>(value, expiresAt)),
          new DistributedCacheEntryOptions { AbsoluteExpiration = expiresAt });
      lifetime.Report(expiresAt);
      return value;

  - id: sureler
    node: store
    edge: null
    title: "Süre verinin türüne göre seçilir"
    what: >-
      Dört süre sınıfı var ve hepsi `CacheTtl` içinde. Anlık fiyat, endeks ve gün içi grafik 5 dk.
      Günlük grafik ve mini seriler 1 saat. Geçmiş günün kapanışı 30 gün.
      `Failure` (5 dk) yalnız tarihli fiyatta kullanılır: fiyat bulunamazsa sonuç bu süreyle yazılır.
    why: >-
      Değişmeyen veri (dünün kapanışı) uzun, sık değişen veri kısa tutulur. Bulunamayan tarihli fiyat için her istekte dış kaynağa gidilmez.
    cost: >-
      Anlık fiyat en fazla 5 dakika eskidir. Durum şeridi (`StatusBar.jsx`) fiyatın zamanını "Fiyatlar 18:10 itibarıyla" diye yazar.
      Bulunamayan tarihli fiyat, kaynak düzelse bile 5 dakika "fiyat yok" görünür.
    terms: [ttl, negative-cache]
    file: market-service/Caching/CacheTtl.cs
    code: |
      public static readonly TimeSpan Live = TimeSpan.FromMinutes(5);       # anlık fiyat, endeks, gün içi grafik
      public static readonly TimeSpan Daily = TimeSpan.FromHours(1);        # günlük grafik, sparkline serileri
      public static readonly TimeSpan Permanent = TimeSpan.FromDays(30);    # geçmiş günün kapanışı (bir daha değişmez)
      public static readonly TimeSpan Failure = TimeSpan.FromMinutes(5);    # başarısız cevap: kalıcı değil, geçici durum

      # PriceOnDateService.cs:
      r => r.Available ? CacheTtl.Permanent : CacheTtl.Failure

  - id: baslik
    node: mmw
    edge: [life, mmw]
    title: "market-service kalan süreyi başlığa yazar"
    what: >-
      `CacheLifetimeMiddleware` cevap gönderilmeden hemen önce (`Response.OnStarting`) `CacheLifetime.SecondsLeft()` değerini okur.
      Sonucu `X-Cache-Expires-In` başlığına yazar. Ör. `X-Cache-Expires-In: 212`.
    why: >-
      Mutlak saat değil kalan saniye gönderilir. Sunucu ile tarayıcının saati farklı olsa da sonuç doğrudur.
    cost: >-
      Bu istekte hiçbir kayıt okunmadı veya yazılmadıysa başlık eklenmez.
    next:
      - { when: "Başlık yazıldı → portfolio-service okur", to: tasima }
      - { when: "Başlık yok → tarayıcı veriyi hemen bayat sayar", to: tarayici }
    terms: [http-header, middleware]
    file: market-service/Middleware/CacheLifetimeMiddleware.cs
    code: |
      public async Task InvokeAsync(HttpContext context, CacheLifetime lifetime)
      {
          context.Response.OnStarting(() =>
          {
              if (lifetime.SecondsLeft() is int seconds)
                  context.Response.Headers[HeaderName] = seconds.ToString();
              return Task.CompletedTask;
          });
          await next(context);
      }

  - id: tasima
    node: plife
    edge: [pclient, plife]
    aux: [pclient]
    auxEdges: [[mmw, pclient]]
    title: "portfolio-service başlığı okur"
    what: >-
      `MarketServiceClient.GetAsync()` cevaptaki `X-Cache-Expires-In` değerini okur.
      Değeri portfolio-service'in kendi `CacheLifetime.Report(seconds)` metoduna verir.
      Bu sınıf saniyeyi kendi saatine göre bitiş anına çevirir ve en erkenini tutar.
    why: >-
      Bir portföy isteği market-service'i birden çok kez çağırabilir. En erken biten çağrı, cevabın tamamının ömrünü belirler.
    cost: >-
      market-service hata verirse başlık okunmaz. Cevap başlıksız gider.
    terms: []
    file: portfolio-service/Clients/MarketServiceClient.cs
    code: |
      if (response.Headers.TryGetValues(CacheLifetimeMiddleware.HeaderName, out var values)
          && int.TryParse(values.FirstOrDefault(), out var seconds))
          cacheLifetime.Report(seconds);

  - id: pbaslik
    node: pmw
    edge: [plife, pmw]
    title: "Aynı başlık tarayıcıya iletilir"
    what: >-
      portfolio-service'in kendi `CacheLifetimeMiddleware` sınıfı aynı işi yapar.
      `SecondsLeft()` değerini `X-Cache-Expires-In` başlığına yazar. Cevap nginx üzerinden tarayıcıya döner.
    why: >-
      Tarayıcı yalnız portfolio-service ile konuşur. Başlık iletilmeseydi Redis'teki süre tarayıcıya ulaşmazdı.
    cost: >-
      Başlık adı iki serviste ayrı tanımlı (`HeaderName`). Ad değişirse iki dosya da değişmeli.
    terms: [http-header, middleware]
    file: portfolio-service/Middleware/CacheLifetimeMiddleware.cs
    code: |
