group: veri
eyebrow: "Akış 07 · Cache · Redis"
title: "Veri *ne kadar* taze?"
lede: >-
  Her veri türünün kendi ömrü var: anlık fiyat 5 dakika, geçmiş kapanış 30 gün.
  Ömür tek yerde tanımlanır ve Redis'ten tarayıcıya kadar taşınır.
stats:
  - { n: 4, l: "süre sınıfı" }
  - { n: 5, l: "dk anlık fiyat" }
