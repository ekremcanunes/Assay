id: container
no: "04"
group: altyapi
eyebrow: "Akış 04 · Container düzeni · Docker Compose"
title: "Sunucuda *ne çalışıyor?*"
lede: >-
  EC2'de tek bir `docker compose` projesi: altı servis, sıfır veritabanı container'ı.
  `deploy.sh` image'ları çeker ve servisleri `depends_on` sırasıyla başlatır.
  Hangi servis neden var, birbirini nasıl buluyor, dev ile prod nerede ayrılıyor.
stats:
  - { n: 6, l: "servis" }
  - { n: 1, l: "prod'da açık port" }
  - { n: 0, l: "DB container'ı" }
  - { n: 2, l: "registry" }

