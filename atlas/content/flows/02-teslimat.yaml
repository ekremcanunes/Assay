id: teslimat
no: "02"
group: altyapi
eyebrow: "Akış 02 · Teslimat · CI/CD"
title: "Kod *prod'a* nasıl çıkar?"
lede: >-
  `main-prod`'a yapılan bir push'tan, EC2'de yeni container'ların çalışmasına kadar.
  GitHub image'ları build eder ve sürümü S3'e bırakır. AWS sürümü bir insan onayından sonra sunucuya taşır.
  Hiçbir yerde uzun ömürlü AWS anahtarı saklanmıyor.
stats:
  - { n: 3, l: "image" }
  - { n: 2, l: "GitHub job'u" }
  - { n: 1, l: "insan onayı" }
  - { n: 0, l: "kalıcı anahtar" }

lanes:
  # Etiketler büyük harfle yazılır; CSS çevirmez (tr dilinde "i" → "İ" olur).
