  - { id: iam, lane: store, col: 3, title: "AWS IAM", sub: "rol · OIDC ile girilir", icon: shield }
  - { id: eb, lane: cd, col: 2, title: "EventBridge", sub: "kural · S3 olayı", icon: bolt }
