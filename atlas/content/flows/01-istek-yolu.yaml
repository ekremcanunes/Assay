steps:
  - id: istek
    node: browser
    edge: null
    title: "Sayfa GET /api/assets isteğini atar"
    what: >-
      `Assets.jsx`, `usePortfolioSummary()` hook'unu çağırır. Bu hook `useHoldings()` çağırır.
      `useHoldings()` veriyi `assetApi.getAll()` ile ister; o da axios ile `GET /api/assets` atar.
      İstek aynı adrese gider. Oturum cookie'si isteğe kendiliğinden eklenir.
    why: >-
      Frontend ve API aynı origin'de. Bu yüzden CORS ayarı ve token taşıma kodu gerekmez.
    cost: >-
      Frontend ayrı bir alan adına taşınırsa CORS ve cookie ayarları yeniden yapılır.
    next:
      - { when: "React Query'deki veri hâlâ taze → istek hiç gitmez, eldeki veri gösterilir", to: cevap }
      - { when: "Veri yok veya bayat → istek gider", to: cloudflare }
    terms: [same-origin, cookie]
    file: web/src/services/api.js
    code: |
      const api = axios.create({ baseURL: '', withCredentials: true })

      export const assetApi = {
        getAll: () => api.get('/api/assets'),

  - id: cloudflare
    node: cf
    edge: [browser, cf]
    title: "Cloudflare isteği karşılar"
    what: >-
      Alan adının DNS kaydı Cloudflare'de ve proxy açık. Tarayıcının TLS bağlantısı Cloudflare'de biter.
      Cloudflare isteği sunucuya yeniden şifreleyerek iletir (mod: Full strict).
    why: >-
      Sunucunun gerçek adresi dışarıdan görünmez. DDoS koruması ücretsiz gelir.
      nginx, Cloudflare'in verdiği Origin sertifikasını kullanır; Cloudflare bu sertifikayı doğrular.
    cost: >-
      nginx'e gelen bağlantının adresi Cloudflare'in adresidir. Gerçek ziyaretçi adresi için ayrı ayar gerekir (sonraki adım).
    terms: [reverse-proxy, tls-termination, origin-cert]
    file: web/nginx.prod.conf
    code: |
      # Prod: Cloudflare (Full strict) -> bu nginx (TLS, Origin sertifikasi) -> container'lar.
      server {
          listen 443 ssl;
          http2 on;
          ssl_certificate     /etc/nginx/certs/origin.pem;
          ssl_certificate_key /etc/nginx/certs/origin.key;

  - node: nginx
    edge: [cf, nginx]
    title: "nginx gerçek IP'yi bulur, limit uygular"
    what: >-
      nginx gerçek ziyaretçi adresini `CF-Connecting-IP` başlığından alır. Bunu yalnız bağlantı Cloudflare'in adres aralığından geliyorsa yapar.
      Sonra IP başına limit uygular: `/api` saniyede 20, giriş/kayıt dakikada 10. Aşılırsa 429 döner, istek servise gitmez.
    why: >-
      Giriş uçları şifre deneme saldırısının hedefidir. Bu yüzden ayrı ve daha sıkı bir limit taşır.
    cost: >-
      `real_ip` ayarı olmasaydı tüm ziyaretçiler tek adres (Cloudflare) sayılırdı ve hep birlikte limitlenirdi.
      Cloudflare adres aralığı değişirse liste elle güncellenir.
    terms: [real-ip, rate-limit]
    file: web/nginx.prod.conf
    code: |
      set_real_ip_from <Cloudflare IP aralıkları>;
      real_ip_header CF-Connecting-IP;

      limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
      limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
      limit_req_status 429;

  - node: portfolio
    edge: [nginx, portfolio]
    title: "nginx isteği portfolio-service'e iletir"
    what: >-
      `/api/` ile başlayan istek `portfolio-service:5001`'e gider. `/.ory/` ile başlayan istek `kratos:4433`'e gider.
      Diğer her yol React'in `index.html`'ine düşer. nginx cookie'yi olduğu gibi iletir.
    why: >-
      Dışarıya yalnız nginx açık (80 ve 443). Servisler `expose` ile yalnız Docker ağının içinde görünür.
      Servis adı aynı zamanda ağ içindeki DNS adıdır.
    cost: >-
      Yeni bir dış uç için `nginx.prod.conf`'a yeni `location` eklenir. Bu dosya image'da değil:
      compose onu sunucudaki repo kopyasından container'a bağlar. Image'daki `nginx.conf` yalnız dev içindir.
    terms: [service-dns, expose, bind-mount]
    file: web/nginx.prod.conf
    code: |
      location /api/ {
          limit_req zone=api burst=40 nodelay;
          proxy_pass http://portfolio-service:5001;
          proxy_set_header Cookie $http_cookie;
      }

  - id: oturum
    node: kratos
    edge: [portfolio, kratos]
    title: "portfolio-service oturumu Kratos'a sorar"
    what: >-
      İstek controller'a varmadan `KratosMiddleware`'den geçer. Middleware cookie'yi `GET /sessions/whoami` ile Kratos'a sorar.
      Oturum yoksa 401 döner. 2FA zorunlu ama oturum AAL1 ise 403 `aal2_required` döner.
      Kratos'a ulaşılamazsa 503 döner. Oturum geçerliyse kullanıcının kimliği `context.Items["UserId"]`'ye yazılır.
    why: >-
      Oturumun tek doğruluk kaynağı Kratos'tur. Servis kendi oturum tablosunu tutmaz.
      403 gelince `api.js` tarayıcıyı `/login?aal2=1` adresine yollar (Akış 03).
    cost: >-
      Her istek Kratos'a bir tur daha atar. Kratos durursa API de durur.
    next:
      - { when: "Oturum geçerli → istek `AssetController`'a geçer", to: veritabani }
    terms: [session, aal]
    file: portfolio-service/Middleware/KratosMiddleware.cs
    code: |
      var request = new HttpRequestMessage(HttpMethod.Get, $"{kratosUrl}/sessions/whoami");

      if (authOptions.Value.MfaRequired && session.Aal != "aal2")
      {
          context.Response.StatusCode = 403;
          await context.Response.WriteAsJsonAsync(new { error = "aal2_required" });
          return;
      }

      context.Items["UserId"] = session.Identity.Id;

  - id: veritabani
    node: pg
    edge: [portfolio, pg]
    title: "Varlıklar Postgres'ten okunur"
    what: >-
      `AssetController.GetAll()`, `AssetService.GetHoldingsAsync(userId)` metodunu çağırır.
      Metot `Assets` tablosundan yalnız bu kullanıcının satırlarını okur.
      Postgres bir container değil; Neon'un yönetilen veritabanıdır ve EC2'nin dışındadır.
    why: >-
      `userId` Kratos'un verdiği kimliktir, tarayıcıdan gelmez. Kullanıcı başkasının satırını isteyemez.
    cost: >-
      Sorgu internet üzerinden Neon'a gider ve gecikme ekler.
    next:
      - { when: "Kullanıcının varlığı yok → fiyat istenmez, boş liste döner", to: cevap }
      - { when: "Varlık var → fiyatlar market-service'ten istenir", to: fiyat }
    terms: [managed-db]
    file: portfolio-service/Services/AssetService.cs
    code: |
      public async Task<List<AssetHoldingDto>> GetHoldingsAsync(string userId)
      {
          var assets = await db.Assets.Where(a => a.UserId == userId).OrderBy(a => a.Symbol).ToListAsync();
          var priceMap = await GetPriceMapAsync(assets);
          return assets.Select(a => MapToHolding(a, priceMap)).ToList();
      }

  - id: fiyat
    node: market
    edge: [portfolio, market]
    title: "Fiyatlar market-service'ten istenir"
    what: >-
      `GetPriceMapAsync()`, `MarketServiceClient.GetPricesAsync()` çağırır.
      İstek tek seferde gider: `GET /api/market/prices?symbols=BIST:THYAO,XAU`. Kullanıcının cookie'si bu isteğe de eklenir.
    why: >-
      Fiyat bilgisi tek serviste toplanır. Cookie eklenir, çünkü market-service de oturumu kendisi doğrular (sonraki adım).
    cost: >-
      market-service hata verirse istek düşmez. Varlıklar fiyatsız döner (`PriceAvailable = false`).
    next:
      - { when: "market-service hata verdi → fiyatsız devam", to: omur }
    terms: [http-client]
    file: portfolio-service/Clients/MarketServiceClient.cs
    code: |
      # Tüm market-service çağrılarının tek yolu: kullanıcının cookie'si iletilir,
      # cevaptaki kalan cache ömrü (X-Cache-Expires-In) bu isteğin CacheLifetime'ına eklenir.
      var cookieHeader = httpContextAccessor.HttpContext?.Request.Headers["Cookie"].ToString();
      if (!string.IsNullOrEmpty(cookieHeader))
          request.Headers.Add("Cookie", cookieHeader);

  - node: kratos
    edge: [market, kratos]
    title: "market-service de oturumu Kratos'a sorar"
    what: >-
      market-service'in kendi `KratosMiddleware`'i aynı cookie'yi `GET /sessions/whoami` ile Kratos'a sorar.
      AAL kuralı da aynıdır: compose iki servise aynı `AUTH_REQUIRED_AAL` değerini verir.
    why: >-
      market-service, isteğin portfolio-service'ten geldiğine güvenmez. Her servis oturumu kendisi doğrular.
    cost: >-
      Bir sayfa açılışında Kratos'a iki tur atılır: biri portfolio-service'ten, biri market-service'ten.
    terms: [session, aal]
    file: market-service/Middleware/KratosMiddleware.cs
    code: |
      # 2FA zorunluluğu: portfolio-service ile aynı kural (compose iki servise aynı AUTH_REQUIRED_AAL değerini verir).
      var mfaRequired = (configuration["Auth:RequiredAal"] ?? "highest_available") != "aal1";
      if (mfaRequired && session.Aal != "aal2")

  - id: redis
    node: redis
    edge: [market, redis]
    title: "Her sembol için önce Redis'e bakılır"
    what: >-
      `MarketController.GetPrices()`, `MarketService.GetPricesAsync()` çağırır. Semboller paralel işlenir.
      Her sembol için `GetPriceAsync()` → `CacheStore.GetOrSetAsync()` çağrılır.
      Anahtar türden, pazardan ve sembolden oluşur. Kayıt varsa Redis'teki değer döner.
    why: >-
      Yahoo'ya her istekte gidilmez. Cevap hızlanır, dış kaynağın limitine takılma riski azalır.
    cost: >-
      Gösterilen veri en fazla TTL kadar eskidir. Anlık fiyat için bu süre 5 dakika.
    next:
      - { when: "Redis'te kayıt var → değer ve bitiş anı döner", to: omur }
      - { when: "Kayıt yok → dış kaynaktan çekilir", to: dis }
    terms: [cache-aside, cache-key]
    file: market-service/Caching/CacheStore.cs
    code: |
      public async Task<T?> GetOrSetAsync<T>(string key, Func<Task<T?>> fetch, Func<T, TimeSpan> ttl) where T : class
      {
          var cached = await cache.GetStringAsync(key);

  - id: dis
    node: yahoo
    edge: [market, yahoo]
    aux: [fx]
    auxEdges: [[market, fx]]
    title: "Kayıt yoksa Yahoo veya Frankfurter"
    what: >-
      Hisse ve altın fiyatı Yahoo'dan, döviz kuru Frankfurter'dan çekilir.
      Hisse ve altın TL'ye çevrilirken USD/TRY kuru gerekir; o da aynı yoldan (önce Redis, yoksa Frankfurter) gelir.
      Gelen değer bitiş anıyla birlikte Redis'e yazılır. Süre `CacheTtl.Live`: 5 dakika.
    why: >-
      Her veri sınıfının süresi tek tabloda (`CacheTtl`) durur. Aynı fiyat hangi sayfada görünürse görünsün aynı tazeliktedir.
    cost: >-
      Yahoo'nun bu ucu resmî değildir. Fiyat gelmezse değer Redis'e yazılmaz; sembol cevaptan çıkar ve bir sonraki istek yeniden dener.
    terms: [ttl, unofficial-api]
    file: market-service/Services/MarketService.cs
    code: |
      return await _cache.GetOrSetAsync(CacheKeys.Price(assetType, market, symbol),
          () => assetType switch
          {
              "Currency" => FetchCurrencyAsync(symbol),
              "Gold" => FetchGoldAsync(symbol),
              _ => FetchStockAsync(market, symbol)
          },
          _ => CacheTtl.Live);

  - id: omur
    node: portfolio
    edge: null
    aux: [market]
    title: "Kalan cache ömrü iki servisten geçer"
    what: >-
      market-service, okuduğu kayıtların en erken bitenini `X-Cache-Expires-In` başlığına yazar (saniye).
      `MarketServiceClient` bu değeri portfolio-service'in `CacheLifetime`'ına bildirir.
      portfolio-service'in `CacheLifetimeMiddleware`'i aynı başlığı tarayıcıya giden cevaba yazar.
    why: >-
      Portföyde birden çok fiyat vardır. En erken biten kayıt esas alınır; böylece hiçbir fiyat süresinden fazla eski gösterilmez.
    cost: >-
      Fiyat hiç alınamadıysa başlık yazılmaz.
    terms: [http-header, scoped]
    file: portfolio-service/Clients/MarketServiceClient.cs
    code: |
      if (response.Headers.TryGetValues(CacheLifetimeMiddleware.HeaderName, out var values)
          && int.TryParse(values.FirstOrDefault(), out var seconds))
          cacheLifetime.Report(seconds);

  - id: cevap
    node: browser
    edge: null
    title: "Tarayıcı veriyi tam o süre taze sayar"
    what: >-
      `serverCached()` başlığı okur ve bitiş anını hesaplar. React Query veriyi bu ana kadar taze sayar.
      Taze veri için yeni istek atılmaz.
    why: >-
      Tarayıcı, Redis kaydı tazelenmeden aynı veriyi tekrar istemez. Süreler yalnız backend'de tutulur.
    cost: >-
      Başlık gelmezse (ör. fiyat alınamadı) veri hemen bayat sayılır ve bir sonraki ihtiyaçta yeniden istenir.
    next:
      - { when: "Süre doldu ve sayfa veriye yeniden ihtiyaç duydu → yeni istek", to: istek }
    terms: [stale-time]
    file: web/src/hooks/queries.js
    code: |
      const EXPIRES_HEADER = 'x-cache-expires-in'

      staleTime: (query) => {
        const expiresAt = query.state.data?.expiresAt
        return expiresAt ? Math.max(0, expiresAt - Date.now()) : 0
      },
