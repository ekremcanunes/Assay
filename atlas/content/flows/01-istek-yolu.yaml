id: istek-yolu
no: "01"
group: altyapi
eyebrow: "Akış 01 · İstek yolu · Ağ"
title: "Bir istek *nereden geçer?*"
lede: >-
  Tarayıcıda "Portföy" sayfası açıldığında giden `GET /api/assets` isteğinin yolu.
  Cloudflare, nginx, iki .NET servisi, Kratos, Neon Postgres, Redis, Yahoo ve Frankfurter: on iki adım.
stats:
  - { n: 12, l: "adım" }
  - { n: 2, l: "rate limit" }
  - { n: 2, l: "açık port" }
  - { n: 1, l: "origin" }

