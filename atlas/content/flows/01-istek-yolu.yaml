id: istek-yolu
no: "01"
group: altyapi
eyebrow: "Akış 01 · İstek yolu · Ağ"
title: "Bir istek *nereden geçer?*"
lede: >-
  Tarayıcıda "Portföy" açıldığında giden tek bir `/api` isteğinin yolu.
  Cloudflare, nginx, iki .NET servisi, Kratos, Postgres, Redis ve Yahoo: sekiz adım.
stats:
  - { n: 8, l: "adım" }
  - { n: 2, l: "rate limit" }
  - { n: 2, l: "açık port" }
  - { n: 1, l: "origin" }

lanes:
  - { id: client, label: "İSTEMCİ", tone: client }
  - { id: edge, label: "CLOUDFLARE", tone: edge }
  - { id: app, label: "EC2 · DOCKER AĞI", tone: app }
  - { id: data, label: "DESTEK SERVİSLERİ · VERİ · DIŞ KAYNAK", tone: data }

nodes:
  - { id: browser, lane: client, col: 0, title: "Tarayıcı", sub: "React · axios", icon: browser }
  - { id: cf, lane: edge, col: 0, title: "Cloudflare", sub: "DNS proxy · TLS", icon: cloud }
  - { id: nginx, lane: app, col: 0, title: "nginx (web)", sub: ":443 · rate limit", icon: shield }
  - { id: portfolio, lane: app, col: 1, title: "portfolio-service", sub: ":5001 · .NET", icon: server }
  - { id: market, lane: app, col: 2, title: "market-service", sub: ":5002 · .NET", icon: server }
