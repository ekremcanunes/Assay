steps:
  - node: assets
    edge: null
    aux: [tx]
    title: "Saklanan: varlık, miktar, maliyet, işlem"
    what: >-
      `Assets` tablosu her varlık için miktarı, ortalama maliyeti ve alış para birimini tutar.
      Her alım ve satış ayrıca `Transactions` tablosuna bir satır olarak yazılır.
      Güncel fiyat bu veritabanında hiç saklanmaz.
    why: >-
      Fiyat her an değişir ve dışarıdan gelir. Saklansaydı bayatlardı. Her istekte market-service'ten güncel değer alınır.
    cost: >-
      Geçmiş bir günün portföy değerini göstermek için o günün fiyatı ayrıca istenmelidir.
    terms: []
    file: portfolio-service/Models/Asset.cs
    code: |
      public decimal Quantity { get; set; }
      # Alışlarda ödenen para birimi (TRY/USD) — AvgCostBasis bu birimdedir
      public string Currency { get; set; } = "TRY";
      public decimal? AvgCostBasis { get; set; }

  - id: sapma
    node: dev
    edge: [price, dev]
    aux: [form]
    auxEdges: [[form, dev]]
    title: "Girilen fiyat gerçekle karşılaştırılır"
    what: >-
      Alım formu (`AddAsset.jsx`) seçilen gün için `usePriceOnDate()` ile referans fiyat ister.
      İstek `GET /api/market/price-on/…` olarak portfolio-service'e gider; portfolio-service onu market-service'e iletir.
      Kullanıcı fiyatı elle yazdıysa form `deviationOf(girilen, referans)` çağırır.
      Sapma %5 ve üstündeyse uyarı gösterilir. %20 ve üstündeyse kayıttan önce onay istenir.
    why: >-
      Formülün gerçek piyasaya göre gürültüsü yaklaşık %0,5'tir. %5 eşiği bunun 10 katıdır; yanlış alarm vermez.
    cost: >-
      Referans fiyat yoksa (tatil, eski tarih) karşılaştırma yapılmaz ve uyarı çıkmaz.
    next:
      - { when: "Fiyat otomatik doldu, kullanıcı değiştirmedi → karşılaştırma yok", to: alim }
      - { when: "Sapma %20 ve üstü → Kaydet'e basınca önce onay penceresi", to: alim }
    terms: [pure-function]
    file: web/src/lib/priceDeviation.js
    code: |
      # Eşikler spec §3'teki ölçüme dayanıyor: formülün gerçek piyasaya göre gürültü
      # tabanı ~%0,5. Sessizlik eşiği %5 = gürültünün 10 katı.
      export const DEVIATION_WARN = 0.05
      export const DEVIATION_CONFIRM = 0.20

      const ratio = Math.abs(e - r) / r

  - id: alim
    node: buy
    edge: [form, buy]
    title: "Ortalama maliyet alım anında hesaplanır"
    what: >-
      Form `POST /api/assets/buy` atar. Hisse alımında `AssetController.Buy()` sembolü market-service'in aktif listesinde doğrular.
      Sonra `AssetService.BuyAsync()` çağrılır. Varlık yoksa maliyet birim fiyattır.
      Varlık varsa ortalama maliyet ağırlıklı olarak yeniden hesaplanır. Farklı para birimiyle ek alım reddedilir.
    why: >-
      Maliyet bir kez yazılır, her okumada yeniden hesaplanmaz.
      Örnek: USD ile alınmış hisseye TL ile ek alım eklenseydi ortalama iki ayrı birimi karıştırırdı.
    cost: >-
      Kayıtlı maliyet yanlışsa varlık listesindeki düzenle formundan elle değiştirilir (`UpdateAsync()`). Bu düzeltme işlem geçmişine yazılmaz.
    terms: [weighted-average]
    file: portfolio-service/Services/AssetService.cs
    code: |
      # Ağırlıklı ortalama maliyet
      var oldCost = asset.AvgCostBasis ?? dto.UnitPrice;
      asset.AvgCostBasis = (asset.Quantity * oldCost + dto.Quantity * dto.UnitPrice)
                           / (asset.Quantity + dto.Quantity);
      asset.Quantity += dto.Quantity;

  - node: tx
    edge: [buy, tx]
    aux: [assets]
    auxEdges: [[buy, assets]]
    title: "İşlem satırı o anki değerleri saklar"
    what: >-
      `BuyAsync()` aynı kayıtta `Transactions`'a bir satır ekler: miktar, birim fiyat, tutar ve işlem gününün USD/TRY kuru (`UsdTryRate`, market-service'ten).
      Varlık satırı ve işlem satırı tek `SaveChangesAsync()` ile yazılır.
      Satışta `SellAsync()` gerçekleşen K/Z'yi de hesaplar: (satış fiyatı − ortalama maliyet) × miktar. Sonuç `RealizedProfitLoss` alanına yazılır.
    why: >-
      Kur ve gerçekleşen K/Z işlem anına aittir; sonradan değişmez. Bu yüzden hesaplanıp saklanır.
    cost: >-
      Kur alınamazsa `UsdTryRate` boş kalır. İşlem engellenmez.
    terms: [realized-pl]
    file: portfolio-service/Services/AssetService.cs
    code: |
      Amount = dto.Quantity * dto.UnitPrice,
      ...
      UnitPrice = dto.UnitPrice,
      UsdTryRate = await GetUsdTryRateAsync(date),

  - id: kz
    node: holdings
    edge: [assets, holdings]
    aux: [price]
    auxEdges: [[price, holdings]]
    title: "Anlık K/Z her istekte yeniden hesaplanır"
    what: >-
      Varlıklar sayfası `useHoldings()` ile `GET /api/assets` atar. `AssetService.GetHoldingsAsync()` varlıkları okur ve fiyatları market-service'ten ister.
      Her varlık için `MapToHolding()` çalışır. Güncel fiyat, varlığın alış para biriminde alınır.
      Gerçekleşmemiş K/Z = (güncel fiyat − ortalama maliyet) × miktar. Yüzde = K/Z ÷ toplam maliyet × 100.
    why: >-
      USD ile alınmış hisse USD fiyatla karşılaştırılır. Kur değişimi hissenin performansına karışmaz.
    cost: >-
      market-service cevap vermezse varlık `PriceAvailable = false` ile döner. K/Z boş görünür, sayfa düşmez.
    next:
      - { when: "Fiyat var → K/Z ve yüzde dolu", to: kategori }
      - { when: "Fiyat yok → K/Z boş; kategori yüzdesine katılmaz", to: kategori }
    terms: [unrealized-pl]
    file: portfolio-service/Services/AssetService.cs
    code: |
      # Güncel birim fiyatı varlığın alış para biriminde bul (P&L kıyaslaması için)
      decimal? currentUnitPrice = a.Currency == "USD" ? price?.PriceInUsd : price?.PriceInTry;

      decimal? totalCost = a.AvgCostBasis.HasValue ? a.Quantity * a.AvgCostBasis.Value : null;
      decimal? unrealized = (a.AvgCostBasis.HasValue && currentUnitPrice.HasValue)
          ? (currentUnitPrice.Value - a.AvgCostBasis.Value) * a.Quantity
          : null;

  - id: kategori
    node: cat
    edge: [holdings, cat]
    aux: [summary]
    auxEdges: [[summary, cat]]
    title: "Kategori özeti tarayıcıda"
    what: >-
      `usePortfolioSummary()` hook'u `useHoldings()` verisini alır ve `summarizeCategories()` fonksiyonunu çağırır.
      Hisse, döviz ve altın için toplam değer, pay ve K/Z yüzdesi çıkar.
      Kategori yüzdesi = (Σ değer − Σ maliyet) ÷ Σ maliyet. Her varlığın maliyeti değer ve yüzdeden geri hesaplanır.
    why: >-
      Hesap saf bir fonksiyondur; yeni sunucu ucu gerektirmez. Varlıklar sayfası ve kategori sayfası aynı hook'u kullanır.
    cost: >-
      Yüzdesi olmayan (fiyatı alınamayan) varlık değere katılır ama yüzdeye katılmaz. Kart bunu ayrıca belirtmez.
    terms: [pure-function]
    file: web/src/lib/portfolioCategories.js
    code: |
      for (const h of items) {
        const p = h.unrealizedProfitLossPercent
        if (p == null || h.valueInTry == null || p <= -100) continue
        v += h.valueInTry
        cost += h.valueInTry / (1 + p / 100)
      }

  - node: pulse
    edge: [price, pulse]
    aux: [panel]
    auxEdges: [[panel, pulse]]
    title: "Piyasa nabzı: dağılım ve ruh hali"
    what: >-
      Piyasa sayfası (`Market.jsx`) `useMarketOverview()` ile `GET /api/market/overview` atar. İstek portfolio-service üzerinden market-service'e gider.
      `StockPanel` bileşeni cevaptaki BIST 30 hisseleriyle `pulse()` çağırır.
      Yükselen, düşen ve sabit sayısı ile ortalama değişim çıkar. ±0,05 altı "değişmedi" sayılır; ortalama ±1'i aşarsa "güçlü" denir.
    why: >-
      Kullanıcı 30 satır okumadan piyasanın yönünü tek bakışta görür.
    cost: >-
      Ortalama ağırlıksızdır: küçük ve büyük şirket aynı etkiye sahiptir. Endeksin kendisiyle aynı yönü göstermeyebilir.
    terms: [pure-function]
    file: web/src/lib/marketPulse.js
    code: |
      const FLAT = 0.05

      export function moodOf(avg) {
        if (avg == null) return null
        if (avg > 1) return 'strongUp'
        if (avg > FLAT) return 'up'
        if (avg < -1) return 'strongDown'
        if (avg < -FLAT) return 'down'
        return 'flat'
      }

  - node: session
    edge: [price, session]
    aux: [bar]
    auxEdges: [[bar, session]]
    title: "Seans açık mı: hüküm tarayıcıda"
    what: >-
      Durum şeridi (`StatusBar`) aynı `useMarketOverview()` verisinden BIST 100 satırını alır.
      Bu satırda Yahoo'nun seans başlangıcı ve bitişi vardır. `sessionOf(bist100, now)` "açık mı" hükmünü anlık saatle verir.
    why: >-
      Piyasa özeti 5 dakika cache'te kalır. Hüküm orada verilseydi seans kapandıktan sonra 5 dakikaya kadar "açık" görünebilirdi.
    cost: >-
      Resmî tatil günündeki davranış henüz doğrulanmadı (BACKLOG'da).
    terms: [ttl]
    file: web/src/lib/marketSession.js
    code: |
      # Backend BIST 100 satırında Yahoo'nun son/şimdiki seans sınırlarını (sessionStart/End)
      # ve son işlem zamanını (asOf) verir. Açık/kapalı hükmü burada, anlık saatle verilir:
      # overview 5 dk önbellekte kalır, hüküm orada verilseydi bayat olabilirdi.
      export function sessionOf(index, now = new Date()) {
        ...
          open: t >= new Date(index.sessionStart).getTime() && t < new Date(index.sessionEnd).getTime(),
