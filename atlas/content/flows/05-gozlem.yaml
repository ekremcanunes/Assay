steps:
  - id: kurulum
    node: serilog
    edge: [appset, serilog]
    title: "Açılış: Serilog seviyeleri okur"
    what: >-
      Servis açılırken `Program.cs` içindeki `AddSerilog(...)` çalışır.
      `ReadFrom.Configuration` ile `appsettings.json` içindeki `Serilog:MinimumLevel` bölümü okunur.
      Varsayılan seviye `Information`. `Microsoft`, `System` ve EF Core yalnız `Warning` ve üstünü yazar.
    why: >-
      Framework her istekte çok sayıda satır üretir. `Override` bu satırları keser, uygulamanın kendi logları kalır.
      `Microsoft.Hosting.Lifetime` ayrıca `Information`'da tutulur: "Application started" satırı her ortamda görünür.
    cost: >-
      İstek logu da `Information` seviyesindedir. Prod'da seviye `Warning` olunca o da düşerdi; bu yüzden ayrı override'ı vardır ve silinmez.
    next:
      - { when: "Container'da docker-compose ortam değişkenleri bu değerleri ezer", to: ortam }
    terms: [log-level]
    file: market-service/appsettings.json
    code: |
      "Serilog": {
        "MinimumLevel": {
          "Default": "Information",
          "Override": {
            "Microsoft": "Warning",
            "Microsoft.Hosting.Lifetime": "Information",
            "Microsoft.EntityFrameworkCore": "Warning",
            "System": "Warning",
            "Serilog.AspNetCore.RequestLoggingMiddleware": "Information"
          }
        }
      }

  - id: ortam
    node: serilog
    edge: [env, serilog]
    title: "Açılış: ortam değişkenleri ayarı ezer"
    what: >-
      `docker-compose.yml`, market-service ve portfolio-service container'larına `Serilog__MinimumLevel__...` değişkenlerini verir.
      .NET ortam değişkenini `appsettings.json`'dan sonra okur; aynı ayar varsa ortam değişkeni kazanır.
      Değerler `.env` dosyasındaki `LOG_LEVEL`, `LOG_LEVEL_FRAMEWORK`, `LOG_LEVEL_EFCORE`'dan gelir. Boşsa `:-` sonrasındaki varsayılan kullanılır.
    why: >-
      Seviye yeni image olmadan değişir. Örnek: `.env`'e `LOG_LEVEL=Warning` yazılır, container yeniden başlatılır.
      Bundan sonra `Information` satırları yazılmaz.
    cost: >-
      Geçersiz değer servisi açtırmaz. Örnek: `LOG_LEVEL=info` yazılırsa Serilog istisna fırlatır ve servis ayağa kalkmaz.
    terms: [env-var, log-level]
    file: docker-compose.yml
    code: |
      - ASPNETCORE_ENVIRONMENT=Production
      # Gerçek prod (AWS) ortamında Warning olarak set edilir; burada lokal teşhis için Information.
      - Serilog__MinimumLevel__Default=${LOG_LEVEL:-Information}
      - Serilog__MinimumLevel__Override__Microsoft=${LOG_LEVEL_FRAMEWORK:-Warning}
      - Serilog__MinimumLevel__Override__System=${LOG_LEVEL_FRAMEWORK:-Warning}
      - Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore=${LOG_LEVEL_EFCORE:-Warning}

  - id: uret
    node: code
    edge: null
    title: "Kod yalnız olay üretir"
    what: >-
      Portföy fiyat isteyince `MarketService.GetPricesAsync()` çalışır. Fiyatı gelmeyen semboller sayılır.
      Döngü bitince `ILogger` ile tek `LogWarning` satırı yazılır.
      Mesaj bir şablondur: sayılar `{InvalidCount}` ve `{MissingCount}` gibi adlı alanlara girer, metne gömülmez.
    why: >-
      Adlı alanlar JSON'da ayrı tutulur ve sorgulanır. Örnek: `MissingCount > 0` olan satırlar süzülür.
      Kod logun nereye gittiğini bilmez; yalnız `ILogger`'ı çağırır.
    cost: >-
      Şablon yerine `$"..."` ile metin birleştirilirse alanlar kaybolur.
      Döngüde her sembol için satır yazılmaz; 50 sembolde 50 satır yerine 1 satır.
      Kullanıcı girdisi (sembol, sorgu) loglanacaksa önce `LogSanitizer.ForLog()` ile satır sonu karakterleri silinir.
    terms: [structured-logging]
    file: market-service/Services/MarketService.cs
    code: |
      var missingCount = valid.Count - prices.Count;
      if (invalidCount > 0 || missingCount > 0)
          _logger.LogWarning("{InvalidCount} sembol geçersiz market nedeniyle, {MissingCount} sembol fiyat bulunamadığı için atlandı",
              invalidCount, missingCount);

  - id: istek
    node: reqlog
    edge: null
    title: "Her HTTP isteği tek satır"
    what: >-
      `Program.cs`, `app.UseSerilogRequestLogging()` ile Serilog'un istek middleware'ini ekler.
      Her HTTP isteği bu middleware'den geçer. Cevap dönünce tek satır yazılır: method, path, status, süre.
    why: >-
      Framework'ün kendi istek logu istek başına birkaç satırdır ve `Warning` override'ıyla kapalıdır. Bu tek satır onun yerine geçer.
      "Çalışıyor ama yavaş" durumu süre alanından görünür.
    cost: >-
      Her istek bir satırdır; log hacmi trafikle büyür.
    terms: [log-level, middleware]
    file: market-service/Program.cs
    code: |
      app.UseSerilogRequestLogging();
      app.UseCors();
      app.UseMiddleware<KratosMiddleware>();

      # Serilog.AspNetCore varsayılan mesaj şablonu:
      # HTTP {RequestMethod} {RequestPath} responded {StatusCode} in {Elapsed:0.0000} ms

  - id: filtre
    node: serilog
    edge: [code, serilog]
    aux: [reqlog]
    auxEdges: [[reqlog, serilog]]
    title: "Serilog seviyeye göre eler"
    what: >-
      Her satır yazılmadan önce Serilog seviyesine bakar. Satırın seviyesi eşiğin altındaysa satır atılır ve hiçbir yere gitmez.
      Eşik, satırı yazan sınıfın ad alanına göre seçilir. En uzun eşleşen `Override` kazanır.
    why: >-
      Örnek: `LOG_LEVEL=Warning` ise `InstrumentCatalog`'un `LogInformation` satırı atılır.
      `MarketService`'in `LogWarning` satırı geçer. İstek satırı kendi override'ı sayesinde `Information`'da da geçer.
    cost: >-
      Atılan satır sonradan geri getirilemez. Teşhis için seviye geçici açılır, iş bitince geri alınır.
    terms: [log-level]
    file: market-service/Program.cs
    code: |
      builder.Services.AddSerilog((services, cfg) =>
      {
          cfg.ReadFrom.Configuration(builder.Configuration)
             .ReadFrom.Services(services)
             .Enrich.FromLogContext();

  - id: json
    node: stdout
    edge: [serilog, stdout]
    title: "Container'da JSON, lokalde metin"
    what: >-
      Geçen satır `WriteTo.Console` ile stdout'a yazılır. Sink, Serilog'da satırın yazıldığı hedeftir; burada tek hedef konsoldur.
      Ortam `Development` değilse `CompactJsonFormatter` ile tek satır JSON basılır.
      docker-compose `ASPNETCORE_ENVIRONMENT=Production` verir; bu yüzden container'da hep JSON çıkar.
      Lokal `dotnet run` ortamı `Development`'tır: düz metin basılır, yalnız terminalde görünür ve Docker'a gitmez.
    why: >-
      Log bir olay akışıdır (12-Factor). Uygulama dosyaya yazmaz; EC2'den ECS'e geçişte kod değişmez.
    cost: >-
      JSON satırları terminalde okunması zordur. Okumak için `jq` gerekir.
    terms: [twelve-factor, stdout, sink]
    file: market-service/Program.cs
    code: |
      if (builder.Environment.IsDevelopment())
          cfg.WriteTo.Console();
      else
          cfg.WriteTo.Console(new CompactJsonFormatter());

  - id: surucu
    node: driver
    edge: [stdout, driver]
    title: "Docker yakalar ve döndürür"
    what: >-
      Docker container'ın stdout'unu `json-file` log sürücüsüyle sunucu diskine yazar.
      Dosya 10 MB olunca kapanır ve yenisi açılır. En fazla 3 dosya kalır; dördüncü gerekince en eski silinir.
      Ayar `docker-compose.yml`'de bir kez tanımlanır ve her servise `logging: *default-logging` ile verilir.
    why: >-
      Rotasyon yoksa dosya container yaşadıkça büyür ve diski doldurur. Üst sınır container başına 30 MB.
    cost: >-
      30 MB'tan eski loglar silinir. Uzun süreli saklama için merkezi bir log servisi gerekir.
    terms: [log-rotation, yaml-anchor]
    file: docker-compose.yml
    code: |
      x-logging: &default-logging
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"

      market-service:
        logging: *default-logging

  - id: okuma
    node: reader
    edge: [driver, reader]
    title: "Okuma: compose logs ve jq"
    what: >-
      Loglar sunucuda `docker compose logs <servis>` ile okunur. Komut `json-file` dosyalarını okur.
      JSON satırları `jq`'ya aktarılır; `jq` satırları biçimler ve alana göre süzer.
    why: >-
      Ek araç kurmadan sunucuda teşhis yapılır.
    cost: >-
      Arama tek sunucu ve son 30 MB ile sınırlıdır. Birden çok sunucuda bu yöntem yetmez.
    terms: [jq]
    file: docs/10-standards/LOGGING.md
    code: |
      JSON logu terminalde okumak için: `docker compose logs market-service | jq`

  - id: plan
    node: cw
    edge: [driver, cw]
    title: "Plan: CloudWatch ve Warning seviyesi"
    what: >-
      Bu adım henüz kurulmadı. Planda log sürücüsü `json-file` yerine `awslogs` olur ve loglar CloudWatch Logs'a akar.
      Seviye `.env` ile `Warning`'e çekilir.
    why: >-
      Uygulama kodu değişmez; yalnız Docker ayarı değişir. Loglar sunucu dışında saklanır ve aranır.
    cost: >-
      CloudWatch log grubu varsayılan olarak süresiz saklar ve fatura büyür. Saklama süresi ve bütçe alarmı zorunlu.
    terms: [log-level]
    file: docs/10-standards/LOGGING.md
    code: |
      1. **Log driver'ı `awslogs`'a çevir** (veya CloudWatch agent kur). `json-file` yerine loglar doğrudan CloudWatch Logs'a akar.
      2. **Retention süresi ZORUNLU olarak set edilir.** CloudWatch log grubunun varsayılanı "süresiz saklama"dır ve **faturanın kontrolsüz şişmesinin bir numaralı sebebi budur**. Öneri: 30 gün (test), 90 gün (prod).
      3. **Seviye `Warning`** — `Serilog__MinimumLevel__Default=Warning`.
