id: gozlem
no: "05"
group: altyapi
eyebrow: "Akış 05 · Gözlem · Loglama"
title: "Bir log satırı *nereye gider?*"
lede: >-
  Servis yalnız stdout'a yazar. Logun nereye gideceğine platform karar verir.
  Açılışta okunan seviye ayarından koddaki tek satıra, oradan diskteki dosyaya ve okuma komutuna kadar.
