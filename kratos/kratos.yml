version: v1.2.0

serve:
  public:
    base_url: http://localhost/.ory/   # tarayıcı Kratos'a nginx/vite /.ory proxy'si üzerinden ulaşır
    cors:
      enabled: true
      allowed_origins:
        - http://localhost
        - http://localhost:80
      allowed_methods: [POST, GET, PUT, PATCH, DELETE]
      allowed_headers: [Authorization, Cookie, Content-Type]
      exposed_headers: [Content-Type, Set-Cookie]
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost/
  allowed_return_urls:
    - http://localhost

  methods:
    password:
      enabled: true
    code:                               # OTP yalnızca 2. faktör; şifresiz giriş kapalı (ikisi aynı anda açılamaz)
      mfa_enabled: true
      passwordless_enabled: false
      config:
        lifespan: 10m                   # kod geçerlilik süresi

  flows:
    error:
      ui_url: http://localhost/error
    settings:
      ui_url: http://localhost/settings
      privileged_session_max_age: 15m   # ayarlar sayfası için kısa oturum doğrulama süresi
    logout:
      after:
        default_browser_return_url: http://localhost/login
    login:
      ui_url: http://localhost/login
      lifespan: 10m                     # login formu doldurmak için max süre
    registration:
      lifespan: 10m                     # kayıt formu doldurmak için max süre
      ui_url: http://localhost/register
    verification:
      enabled: true                     # AUTH_VERIFICATION_ENABLED ezer
      use: code
      ui_url: http://localhost/verification
      lifespan: 15m

session:
  lifespan: 8h                          # session süresi — 8 saat
  cookie:
    persistent: false                   # tarayıcı kapanınca cookie silinsin
  whoami:
    required_aal: aal2                  # her girişte 2FA; AUTH_REQUIRED_AAL ezer

log:
  level: info
  format: text
  leak_sensitive_values: false

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true   # COURIER_SMTP_CONNECTION_URI ezer
    from_address: no-reply@assay.com.tr                          # COURIER_SMTP_FROM_ADDRESS ezer
    from_name: Assay
  channels:
    - id: sms
      type: http
      request_config:
        url: http://portfolio-service:5001/internal/sms
        method: POST
        body: file:///etc/config/kratos/sms-body.jsonnet
        auth:
          type: api_key
          config:
            name: X-Api-Key
            value: PLEASE-CHANGE-ME                              # COURIER_CHANNELS_0_REQUEST_CONFIG_AUTH_CONFIG_VALUE ezer
            in: header
  templates:
    login_code:
      valid:
        email:
          subject: file:///etc/config/kratos/templates/login_code/valid/email.subject.gotmpl
          body:
            html: file:///etc/config/kratos/templates/login_code/valid/email.body.gotmpl
            plaintext: file:///etc/config/kratos/templates/login_code/valid/email.body.plaintext.gotmpl
        sms:
          body:
            plaintext: file:///etc/config/kratos/templates/login_code/valid/sms.body.gotmpl
    verification_code:
      valid:
        email:
          subject: file:///etc/config/kratos/templates/verification_code/valid/email.subject.gotmpl
          body:
            html: file:///etc/config/kratos/templates/verification_code/valid/email.body.gotmpl
            plaintext: file:///etc/config/kratos/templates/verification_code/valid/email.body.plaintext.gotmpl
        sms:
          body:
            plaintext: file:///etc/config/kratos/templates/verification_code/valid/sms.body.gotmpl
