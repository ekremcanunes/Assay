# Prod: Cloudflare (Full strict) -> bu nginx (TLS, Origin sertifikasi) -> container'lar.
# Dev'de docker-compose.override.yml bunun yerine nginx.conf'u (duz HTTP) mount eder.

# --- Gercek kullanici IP'si ---
# Istekler Cloudflare'den gelir; IP'yi CF-Connecting-IP basligindan al, ama YALNIZCA
# baglanti Cloudflare'in kendi araliklarindan geliyorsa (baskasi basligi taklit edemesin).
# Kaynak: https://www.cloudflare.com/ips-v4 ve /ips-v6 (2026-09-27)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- Rate limit (IP basina) ---
# auth: giris/kayit denemeleri (sifre deneme saldirisi hedefi) -> dakikada 10
# api : uygulama istekleri -> saniyede 20
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://portfolio-service:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
    }

    location /.ory/self-service/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://kratos:4433/self-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
    }

    location /.ory/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://kratos:4433/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
    }

    # Vite ciktisi: dosya adlari icerik hash'i tasir, degisince adi da degisir -> kalici cache guvenli.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html her seferinde tazelensin, yoksa yeni deploy'daki hash'li dosyalar gorulmez.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
